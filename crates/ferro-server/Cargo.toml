[package]
name = "ferro-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferro HTTP boundary — guards, /api/v1, static web, events, jobs"

[dependencies]
ferro-core = { path = "../ferro-core" }
ferro-agent = { path = "../ferro-agent" }
ferro-forge = { path = "../ferro-forge" }
tokio.workspace = true
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "compression-gzip", "catch-panic"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1"
arc-swap = "1.7"
lru = "0.12"
parking_lot = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
url = "2"
regex = "1"
pulldown-cmark = "0.12"
ammonia = "4"
similar = "2"
syntect = "5"
ulid = "1.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
mimalloc = { version = "0.1", features = ["secure"] }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
# No provider feature: `tls-rustls` would also link aws-lc-rs, and tls.rs installs ring anyway.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3"
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
