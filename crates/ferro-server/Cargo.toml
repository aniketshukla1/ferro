[package]
name = "ferro-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferro HTTP boundary — guards, /api/v1, legacy routes, events, jobs"

[dependencies]
ferro-core = { path = "../ferro-core" }
ferro-agent = { path = "../ferro-agent" }
tokio.workspace = true
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "compression-gzip", "catch-panic"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
arc-swap = "1.7"
lru = "0.12"
parking_lot = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
url = "2"
regex = "1"
pulldown-cmark = "0.12"
ammonia = "4"
similar = "2"
syntect = "5"
ulid = "1.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
mimalloc = { version = "0.1", features = ["secure"] }
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[dev-dependencies]
tempfile = "3"
