[package]
name = "ferro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferro CLI — fast local code review server"

[lib]
name = "ferro_cli"
path = "src/lib.rs"

# `{ repo }` comes from package.repository. Leave repository unset until the
# board chooses an update host. The archive file name
# is ferro-{ target }.tar.gz for every triple in the B8 release matrix.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ferro-{ target }.tar.gz"
# Path of the binary inside the flat archive (not a directory). `{ binary-ext }` is `.exe` on Windows.
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[[bin]]
name = "ferro"
path = "src/main.rs"

[dependencies]
thiserror = "2"
ferro-core = { path = "../ferro-core" }
ferro-agent = { path = "../ferro-agent" }
ferro-forge = { path = "../ferro-forge" }
ferro-server = { path = "../ferro-server" }
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "time"] }

[[test]]
name = "binstall_metadata"
path = "tests/binstall_metadata.rs"
