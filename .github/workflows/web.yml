name: web
on:
  push:
    paths:
      - 'web/**'
      - 'playwright.config.js'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'playwright.config.js'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every ES module
        run: node web/tests/tools/check-syntax.mjs
      - name: Unit tests (security sinks, theme contrast, keys, fuzzy, find, markdown mock, git status)
        run: node --test web/tests/unit/*.test.js

  browser:
    name: Playwright e2e, axe, and § 9 budgets
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/tests/pnpm-lock.yaml
      - name: Install test dependencies from the frozen lockfile
        run: pnpm --dir web/tests install --frozen-lockfile
      - name: Read Playwright version for the browser cache key
        id: playwright-version
        run: echo "version=$(pnpm --dir web/tests exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright operating-system dependencies
        run: pnpm --dir web/tests exec playwright install-deps chromium webkit firefox
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --dir web/tests exec playwright install chromium webkit firefox
      - name: Run Playwright e2e, axe, and performance-budget specs
        run: pnpm --dir web/tests test
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/tests/test-results
          if-no-files-found: ignore
