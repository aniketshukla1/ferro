name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p ferro --release
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
  desktop-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/package.json
      - run: pnpm --dir apps/desktop install
      - run: cargo check -p ferro-tauri
  perf-gate:
    # BACKEND.md §5.5: fail if ferro is >25% slower than baseline on the
    # small corpus (fuzzy / full-scan miss / open warm).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p ferro --release
      - run: ./benchmark.sh --clone
      - run: python3 bench/h2h.py --only ferro --repos flask,redis --gate bench/baseline.json
