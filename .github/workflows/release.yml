name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p ferro --target ${{ matrix.target }}
      - name: package (flat archive)
        shell: bash
        run: |
          stage="stage"
          mkdir -p "$stage"
          bin="target/${{ matrix.target }}/release/ferro"
          [ "${{ matrix.os }}" = "windows-latest" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE "$stage/"
          tar -czf "ferro-${{ matrix.target }}.tar.gz" -C "$stage" .
      - uses: actions/upload-artifact@v4
        with:
          name: ferro-${{ matrix.target }}.tar.gz
          path: ferro-${{ matrix.target }}.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum ferro-*.tar.gz > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
