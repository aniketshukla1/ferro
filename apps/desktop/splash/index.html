<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>ferro</title>
<style>
  /* Surface tokens match web/styles/themes.css: graphite (dark default) and porcelain (light).
     The mark matches web/styles/shell.css and the boot splash in web/index.html. */
  :root {
    color-scheme: dark;
    --bg-chrome: #0f0f11;
    --fg: #ededf0;
    --dur-3: 200ms;
    --ease-out: cubic-bezier(0.2, 0, 0, 1);
    --font-ui: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg-chrome: #f6f6f7;
      --fg: #16161a;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --dur-3: 0ms; }
  }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg-chrome); color: var(--fg);
    font: 14px/1.5 var(--font-ui);
  }
  .boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--bg-chrome);
  }
  .mark {
    display: inline-grid; place-items: center;
    width: 40px; height: 40px; border-radius: 22%;
    background: linear-gradient(135deg, #ff8c2e 0%, #f2542d 55%, #c22e3d 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    animation: boot-in var(--dur-3) var(--ease-out) 160ms both;
  }
  .mark svg { width: 62%; height: 62%; fill: #fff; stroke: none; }
  @keyframes boot-in { from { opacity: 0; transform: scale(0.94); } }
  @media (prefers-reduced-motion: reduce) {
    .mark { animation: none; }
  }
</style>
</head>
<body>
<div class="boot" role="status" aria-label="Loading ferro"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="4" height="17" rx="1.1"/><rect x="6" y="3.5" width="13" height="4" rx="1.1"/><rect x="6" y="10.6" width="10" height="3.6" rx="1.1"/></svg></span></div>
</body>
</html>
