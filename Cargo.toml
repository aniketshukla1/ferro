[package]
name = "ferro"
version = "0.1.0"
edition = "2021"
description = "Ferro — fast local code review for humans and AI. Rust rival to px0."
license = "MIT"

[[bin]]
name = "ferro"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
open = "5"
similar = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
