# cargo-deny configuration (quality gate § 5.5.4).
[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
  { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 is a product dependency; upgrading it changes product code and is out of scope for the CI gate PR" },
  { id = "RUSTSEC-2026-0253", reason = "lru 0.12.5 is a product dependency; upgrading it changes product code and is out of scope for the CI gate PR" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is an unmaintained transitive dependency of syntect; no safe upgrade is available" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is pulled by Tauri's GTK bindings on Linux; no safe upgrade is available" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property 0.9.0 is pulled by Tauri's urlpattern stack; no safe upgrade is available" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range 0.9.0 is pulled by Tauri's urlpattern stack; no safe upgrade is available" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common 0.9.0 is pulled by Tauri's urlpattern stack; no safe upgrade is available" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 0.9.0 is pulled by Tauri's urlpattern stack; no safe upgrade is available" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 0.9.0 is pulled by Tauri's urlpattern stack; no safe upgrade is available" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust 0.4.5 is an unmaintained transitive dependency of syntect; no safe upgrade is available" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "Zlib",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
  # MPL-2.0 is file-level copyleft: it stays confined to these upstream crates, which ferro uses
  # unchanged. Pinned per version so every new MPL version gets its own review.
  # cssparser 0.37 / cssparser-macros 0.7 / selectors 0.38: Tauri's HTML tooling (dom_query).
  { allow = ["MPL-2.0"], crate = "cssparser@0.37.0" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros@0.7.1" },
  { allow = ["MPL-2.0"], crate = "selectors@0.38.0" },
  # cssparser 0.38: ammonia's sanitizer (a security dependency worth keeping).
  { allow = ["MPL-2.0"], crate = "cssparser@0.38.0" },
  # dtoa-short: float formatting shared by both cssparser versions.
  { allow = ["MPL-2.0"], crate = "dtoa-short@0.3.5" },
  # option-ext: used only through dirs/Tauri for platform directory discovery.
  { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
