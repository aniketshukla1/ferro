<!doctype html>
<html lang="en" data-theme="tokyo">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ferro — fast review</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>
  <div class="logo"><span class="mark"></span>ferro</div>
  <button id="palette-trigger" title="Command palette"><span class="mut">Search files, commands…</span><kbd>Ctrl K</kbd></button>
  <input id="askq" placeholder="Ask agent… (Enter)" autocomplete="off" spellcheck="false"/>
  <button id="theme-btn" title="Cycle theme">◐</button>
  <button id="open" title="Open folder (Tauri)">Open</button>
</header>
<div id="palette" hidden>
  <div id="palette-box">
    <input id="palette-input" placeholder="Type to fuzzy-find files · > for search · :line · ? help" autocomplete="off" spellcheck="false"/>
    <div id="palette-results"></div>
    <div id="palette-hint">↑↓ navigate · Enter open · Esc close</div>
  </div>
</div>
<main>
  <aside id="sidebar">
    <div id="side-head"><span>FILES</span><span id="side-count"></span><button id="reindex" title="Rebuild index">↻</button></div>
    <div id="files"></div>
  </aside>
  <section id="view">
    <div id="tabs" hidden></div>
    <div id="filebar" hidden><span id="filebar-path"></span><span id="filebar-meta"></span><span id="filebar-dirty" hidden>●</span><button id="ol-toggle" title="Symbol outline (Ctrl+Shift+O)">≡</button></div>
    <div id="askpanel" hidden><button id="askclose">×</button><div id="askbody"></div></div>
    <div id="diffview" hidden></div>
    <div id="outline" hidden><div class="ol-head">OUTLINE</div><div id="ol-items"></div></div>
    <div id="home"><div class="hero">
      <div class="hero-logo"><span class="mark big"></span></div>
      <h1>ferro</h1>
      <p class="tag">Review code. Damn fast.</p>
      <div id="hero-stats"></div>
      <div class="hero-actions">
        <button data-act="palette">Open palette <kbd>Ctrl K</kbd></button>
        <button data-act="diff">View diff <kbd>Ctrl D</kbd></button>
        <button data-act="ask">Ask agent</button>
      </div>
      <div class="hero-cols">
        <div><h4>Shortcuts</h4><div id="hero-keys"></div></div>
        <div><h4>Recent</h4><div id="hero-recent"></div></div>
      </div>
    </div></div>
    <div id="viewport" hidden><div id="spacer"><div id="rows"></div></div></div>
    <pre id="plain">Select a file, or press Ctrl+K to jump anywhere.</pre>
  </section>
</main>
<footer id="status">
  <span id="st-backend"></span><span id="st-files"></span><span id="st-index"></span>
  <span class="spacer"></span>
  <span id="st-branch"></span><span id="st-file"></span><span id="st-line"></span>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
