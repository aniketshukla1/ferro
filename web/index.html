<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ferro — fast review</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>
  <strong>ferro</strong>
  <span id="stats">indexing…</span>
  <input id="q" placeholder="Ctrl+P fuzzy · >search · Ctrl+D diff · Ctrl+O folder" autocomplete="off"/>
  <button id="open" title="Open folder (Tauri)">Open</button>
</header>
<main>
  <aside id="files"></aside>
  <section id="view">
    <div id="viewport" hidden><div id="spacer"><div id="rows"></div></div></div>
    <pre id="plain">Select a file. Press Ctrl+P to fuzzy-find.</pre>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
