<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ferro — fast review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8c2e'/%3E%3Cstop offset='.55' stop-color='%23f2542d'/%3E%3Cstop offset='1' stop-color='%23c22e3d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='36' font-weight='900' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>
  <div class="logo"><span class="mark"></span>ferro</div>
  <button id="palette-trigger" title="Command palette"><span class="mut">Search files, commands…</span><kbd>Ctrl K</kbd></button>
  <input id="askq" placeholder="Ask agent… (Enter)" autocomplete="off" spellcheck="false"/>
  <button id="theme-btn" title="Cycle theme" aria-label="Cycle color theme">◐</button>
  <button id="open" title="Open folder (Tauri)">Open</button>
</header>
<div id="palette" hidden>
  <div id="palette-box">
    <input id="palette-input" placeholder="Type to fuzzy-find files · > for search · :line · ? help" autocomplete="off" spellcheck="false"/>
    <div id="palette-results"></div>
    <div id="palette-hint">↑↓ navigate · Enter open · Esc close</div>
  </div>
</div>
<main>
  <aside id="sidebar">
    <div id="side-head"><span>FILES</span><span id="side-count"></span><button id="reindex" title="Rebuild index" aria-label="Rebuild file index">↻</button></div>
    <div id="files"></div>
  </aside>
  <section id="view">
    <div id="tabs" hidden></div>
    <div id="filebar" hidden><span id="filebar-path"></span><span id="filebar-meta"></span><span id="filebar-dirty" hidden>●</span><button id="ol-toggle" title="Symbol outline (Ctrl+Shift+O)" aria-label="Toggle symbol outline">≡</button></div>
    <div id="content">
      <div id="askpanel" hidden><button id="askclose" aria-label="Close ask panel">×</button><div id="askbody"></div></div>
      <div id="diffview" hidden></div>
      <div id="outline" hidden><div class="ol-head">OUTLINE</div><div id="ol-items"></div></div>
    <div id="home"><div class="hero">
      <div class="hero-logo"><span class="mark big"></span></div>
      <h1>ferro</h1>
      <p class="tag">Review code. Damn fast.</p>
      <div id="hero-stats" role="status"></div>
      <div class="hero-actions">
        <button data-act="palette">Open palette <kbd>Ctrl K</kbd></button>
        <button data-act="diff">View diff <kbd>Ctrl D</kbd></button>
        <button data-act="ask">Ask agent</button>
      </div>
      <div class="hero-cols">
        <div><h2>Shortcuts</h2><div id="hero-keys"></div></div>
        <div><h2>Recent</h2><div id="hero-recent"></div></div>
      </div>
    </div></div>
    <div id="viewport" hidden><div id="spacer"><div id="rows"></div></div></div>
    <div id="findbar" hidden><input id="find-input" placeholder="Find in file" aria-label="Find in file"/><span class="cnt" id="find-count"></span></div>
    <pre id="plain">Select a file, or press Ctrl+K to jump anywhere.</pre>
    </div>
  </section>
</main>
<footer id="status">
  <span id="st-backend"></span><span id="st-files"></span><span id="st-index"></span>
  <span class="spacer"></span>
  <span id="st-branch"></span><span id="st-file"></span><span id="st-line"></span>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
